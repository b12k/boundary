<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 320" role="img" aria-labelledby="title description">
  <title id="title">Imports across module boundaries</title>
  <desc id="description">Orders can import from the public index of Users. It cannot import the nested Service module directly. Within Users, Controller can import Service, and Service can import Repository. Repository cannot import Controller.</desc>
  <style>
    svg { color: #557d98; }
    .allowed { color: #168044; }
    .blocked { color: #b42318; }
    @media (prefers-color-scheme: dark) {
      svg { color: #b0cedf; }
      .allowed { color: #4ade80; }
      .blocked { color: #ff847c; }
    }
  </style>
  <defs>
    <marker id="allowed-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="allowed" d="M1 1 L7 4 L1 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="blocked-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="blocked" d="M1 1 L7 4 L1 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <g fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".65">
    <rect x="16" y="56" width="136" height="120" rx="10" />
    <rect x="240" y="16" width="416" height="256" rx="10" />
    <rect x="424" y="56" width="168" height="48" rx="7" />
    <rect x="424" y="128" width="168" height="48" rx="7" />
    <rect x="424" y="200" width="168" height="48" rx="7" />
    <rect x="264" y="56" width="136" height="48" rx="7" />
  </g>
  <g fill="currentColor" font-family="monospace" font-size="16" font-weight="600">
    <text x="32" y="111">orders/</text>
    <text x="264" y="41">users/</text>
    <text x="280" y="77">index.ts</text>
    <text x="440" y="77">controller/</text>
    <text x="440" y="149">service/</text>
    <text x="440" y="221">repository/</text>
  </g>
  <g fill="currentColor" font-family="system-ui, sans-serif" font-size="12">
    <text x="32" y="131" font-family="monospace" font-size="14">view.ts</text>
    <text x="280" y="93">Public API</text>
    <text x="440" y="93">index.ts</text>
    <text x="440" y="165">index.ts</text>
    <text x="440" y="237">index.ts</text>
  </g>
  <g class="allowed" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#allowed-arrow)">
    <path d="M156 80 H260" />
    <path d="M508 108 V124" />
    <path d="M508 180 V196" />
    <path d="M192 296 H224" />
  </g>
  <g class="blocked" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4">
    <path d="M156 152 H320 M596 224 H624 V160" />
    <path d="M336 152 H420" marker-end="url(#blocked-arrow)" />
    <path d="M624 144 V80 H596" marker-end="url(#blocked-arrow)" />
    <path d="M344 296 H376" marker-end="url(#blocked-arrow)" />
  </g>
  <g class="blocked" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M324 148 L332 156 M332 148 L324 156" />
    <path d="M620 148 L628 156 M628 148 L620 156" />
  </g>
  <g fill="currentColor" font-family="system-ui, sans-serif" font-size="14">
    <text x="236" y="301">Allowed import</text>
    <text x="388" y="301">Blocked import</text>
  </g>
</svg>
